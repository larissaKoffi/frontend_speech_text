<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Recorder</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!--link rel="shortcut icon" href="https://www.callcentrehelper.com/images/stories/2023/08/voice-1310817572-760.jpg" type="image/x-icon"--->
</head>
<body>
    
    <main>

        <button class="mic-toggle" id="mic">
            <span class="material-icons">mic</span>
        </button>

        <audio class="playback" controls></audio>


        <div id="output" class="outputText"></div>
    </main>

    <script src="main.js"></script>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition){
            alert("Votre navigateur ne supporte pas la reconnaissance vocale")
        } else {
            const mic = document.getElementById("mic");
            const output = document.getElementById("output");
            const audioPlayer = document.querySelector("audio");
            const recognition = new SpeechRecognition();
            recognition.lang = "fr-FR";
            recognition.interimResults = false;
        
            let transcript = ""; // transcript global
            let audioChunks = [];
        
            recognition.onresult = (event) => {
                transcript = event.results[0][0].transcript;
                console.log("Transcript reçu :", transcript);
            };
        
            mic.addEventListener("click", async () => {
                mic.classList.add("active");
        
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
        
                mediaRecorder.ondataavailable = (e) => {
                    audioChunks.push(e.data);
                };
        
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioPlayer.src = URL.createObjectURL(audioBlob);
        
                    const formData = new FormData();
                    formData.append('text', transcript);
                    formData.append('audio', audioBlob, 'audio.webm');
        
                    try {
                        const res = await fetch('https://huggingface.co/spaces/laryK/backend_speech_text/analyze', {
                            method: 'POST',
                            mode: 'cors',
                            credentials: 'include',
                            body: formData 
                        });
        
                        const data = await res.json();
                        output.innerHTML = `
                            <p><strong>Résumé :</strong> ${data.summary}</p>
                            <p><strong>Émotion détectée :</strong> ${data.emotion}</p>
                        `;
                        console.log("Réponse backend :", data);
                    } catch (err) {
                        console.error(err);
                        output.textContent = "Erreur dans l'analyse.";
                    }
                };
        
                recognition.start();
                mediaRecorder.start();
        
                setTimeout(() => {
                    mediaRecorder.stop();
                    recognition.stop();
                    mic.classList.remove("active");
                }, 5000);
            });
        }
        </script>
        
        

</body>
</html>
